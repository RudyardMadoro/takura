name: takura-production
services:
  migrate:
    image: flyway/flyway:11.14.1-alpine
    entrypoint: ['/bin/sh', '-ec']
    command:
      [
        'flyway -url=jdbc:postgresql://postgres:5432/${DATABASE_NAME} -user=$$(cat /run/secrets/db_migration_user) -password=$$(cat /run/secrets/db_migration_password) -schemas=takura -connectRetries=30 -locations=filesystem:/sql migrate',
      ]
    environment:
      FLYWAY_CLEAN_DISABLED: 'true'
    volumes: ['./backend/src/main/resources/db/migration:/sql:ro']
    secrets: [db_migration_user, db_migration_password]
    networks: [data]
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER_FILE: /run/secrets/db_admin_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_user, db_admin_password]
    volumes: ['postgres-data:/var/lib/postgresql/data']
    networks: [data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U $$(cat /run/secrets/db_admin_user) -d ${DATABASE_NAME}'],
        interval: 10s,
        timeout: 5s,
        retries: 12,
      }
    deploy: { resources: { limits: { cpus: '1.5', memory: 1536M } } }
  clamav:
    image: clamav/clamav:1.4.3
    volumes: ['clamav-signatures:/var/lib/clamav']
    networks: [private]
    healthcheck:
      { test: ['CMD', '/usr/local/bin/clamdcheck.sh'], interval: 30s, timeout: 5s, retries: 20 }
    deploy: { resources: { limits: { cpus: '1.0', memory: 1536M } } }
  api: &backend
    image: ${API_IMAGE:?set tested digest, for example registry/api@sha256:...}
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_FLYWAY_ENABLED: 'false'
      MANAGEMENT_ADDRESS: 0.0.0.0
      CLAMAV_HOST: clamav
      TAKURA_RELEASE_DIGEST: ${RELEASE_DIGEST}
      FAKE_AUTHENTICATION_ENABLED: 'false'
      FAKE_MALWARE_SCANNING_ENABLED: 'false'
      PAYMENT_ENABLED: 'false'
      SES_ENABLED: ${SES_ENABLED:-false}
    secrets:
      - { source: db_runtime_user, target: DATABASE_RUNTIME_USER }
      - { source: db_runtime_password, target: DATABASE_RUNTIME_PASSWORD }
    networks: [private, data, management]
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        clamav: { condition: service_healthy },
      }
    deploy: { resources: { limits: { cpus: '1.0', memory: 1024M } } }
  worker:
    <<: *backend
    environment:
      SPRING_PROFILES_ACTIVE: production,worker
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_FLYWAY_ENABLED: 'false'
      SERVER_PORT: -1
      MANAGEMENT_ADDRESS: 0.0.0.0
      CLAMAV_HOST: clamav
      TAKURA_RELEASE_DIGEST: ${RELEASE_DIGEST}
      FAKE_AUTHENTICATION_ENABLED: 'false'
      FAKE_MALWARE_SCANNING_ENABLED: 'false'
      PAYMENT_ENABLED: 'false'
      SES_ENABLED: ${SES_ENABLED:-false}
  public:
    image: ${PUBLIC_IMAGE:?set tested digest}
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    environment: { TAKURA_PUBLIC_SITE_MODE: PRODUCTION, TAKURA_API_ORIGIN: 'http://api:8080' }
    networks: [private]
    deploy: { resources: { limits: { cpus: '0.75', memory: 512M } } }
  staff:
    image: ${STAFF_IMAGE:?set tested digest}
    read_only: true
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=32m',
        '/var/cache/nginx:rw,noexec,nosuid,size=32m',
        '/var/run:rw,noexec,nosuid,size=4m',
      ]
    networks: [private]
    deploy: { resources: { limits: { cpus: '0.25', memory: 128M } } }
  gateway:
    image: nginxinc/nginx-unprivileged:1.29.5-alpine3.23
    read_only: true
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=32m',
        '/var/cache/nginx:rw,noexec,nosuid,size=32m',
        '/var/run:rw,noexec,nosuid,size=4m',
      ]
    volumes: ['./infra/contabo/nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080']
    networks: [edge, private]
    depends_on: [api, public, staff]
    deploy: { resources: { limits: { cpus: '0.5', memory: 256M } } }
networks:
  edge: {}
  private: { internal: true }
  data: { internal: true }
  management: { internal: true }
volumes:
  postgres-data: {}
  clamav-signatures: {}
secrets:
  db_admin_user: { file: '${SECRET_DIR}/db_admin_user' }
  db_admin_password: { file: '${SECRET_DIR}/db_admin_password' }
  db_migration_user: { file: '${SECRET_DIR}/db_migration_user' }
  db_migration_password: { file: '${SECRET_DIR}/db_migration_password' }
  db_runtime_user: { file: '${SECRET_DIR}/db_runtime_user' }
  db_runtime_password: { file: '${SECRET_DIR}/db_runtime_password' }
