server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location = /admin { return 308 /admin/; }
  location /admin/ { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store" always; }
  location ~* \.[0-9a-f]{8,}\.(js|css)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
