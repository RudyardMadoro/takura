events { worker_connections 1024; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
  upstream api { server api:8080; }
  upstream public_ssr { server public:4000; }
  upstream staff_assets { server staff:8080; }
  server {
    listen 8080;
    server_name _;
    client_max_body_size 11m;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/v1/ {
      limit_req zone=public_api burst=20 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";
      proxy_read_timeout 30s;
    }
    location /admin/ { proxy_pass http://staff_assets; proxy_set_header Host $host; }
    location / { proxy_pass http://public_ssr; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
  }
}
