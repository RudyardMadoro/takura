groups:
  - name: takura-readiness
    rules:
      - alert: SyntheticSubmissionFailedTwice
        expr: increase(takura_synthetic_submission_failures_total[10m]) >= 2
        labels: { severity: page }
        annotations: { summary: 'Two consecutive synthetic submissions failed' }
      - alert: NotificationBacklogTooOld
        expr: max(takura_notification_oldest_seconds) > 900
        for: 2m
        labels: { severity: page }
        annotations: { summary: 'Notification backlog exceeds 15 minutes' }
      - alert: ScanBacklogTooOld
        expr: max(takura_scan_oldest_seconds) > 1800
        for: 2m
        labels: { severity: page }
        annotations: { summary: 'Scan backlog exceeds 30 minutes' }
      - alert: DiskUsageHigh
        expr: 100 * (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 80
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'Disk usage exceeds 80 percent' }
      - alert: BackupTooOld
        expr: time() - takura_backup_last_success_seconds > 93600
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Latest successful backup is too old' }
      - alert: ApiErrorsSustained
        expr: sum(rate(takura_http_server_errors_total[5m])) > 0.05
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'API error rate is sustained' }
      - alert: ApiLatencySustained
        expr: histogram_quantile(0.95, sum by (le) (rate(takura_http_server_duration_seconds_bucket[10m]))) > 1
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'API p95 latency exceeds the proposed threshold' }
