spring:
  application:
    name: takura-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/takura}
    username: ${DATABASE_RUNTIME_USER:takura_runtime}
    password: ${DATABASE_RUNTIME_PASSWORD:local-runtime-only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/takura}
    user: ${DATABASE_MIGRATION_USER:takura_migrator}
    password: ${DATABASE_MIGRATION_PASSWORD:local-migration-only}
    default-schema: takura
    schemas: takura
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    property-naming-strategy: SNAKE_CASE
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      service: takura-backend
      environment: ${TAKURA_ENVIRONMENT:local}
      release: ${TAKURA_RELEASE_DIGEST:development}
    distribution:
      percentiles-histogram:
        takura.http.server.duration: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.10}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
logging:
  structured:
    format:
      console: ecs
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: OFF
takura:
  communications:
    staff-alert-recipient: ${STAFF_ALERT_RECIPIENT:staff-operations@example.invalid}
    ses:
      enabled: ${SES_ENABLED:false}
      sender: ${SES_APPROVED_SENDER:disabled@example.invalid}
      region: ${SES_REGION:af-south-1}
      sns-topic-arn: ${SES_SNS_TOPIC_ARN:disabled}
    sms-enabled: ${SMS_ENABLED:false}
    whatsapp-enabled: ${WHATSAPP_ENABLED:false}
  payments:
    enabled: ${PAYMENT_ENABLED:false}
  privacy:
    unsuccessful-review-days: ${PRIVACY_UNSUCCESSFUL_REVIEW_DAYS:365}
    won-auto-delete-enabled: false
  telemetry:
    log-retention-days: ${LOG_RETENTION_DAYS:14}
    trace-retention-days: ${TRACE_RETENTION_DAYS:7}
    metric-retention-days: ${METRIC_RETENTION_DAYS:30}
  media:
    reviewed-video-enabled: ${REVIEWED_STAFF_VIDEO_ENABLED:false}
  storage:
    region: ${STORAGE_REGION:af-south-1}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:19000}
    upload-origin: ${STORAGE_UPLOAD_ORIGIN:http://localhost:19000}
    access-key: ${STORAGE_ACCESS_KEY:test}
    secret-key: ${STORAGE_SECRET_KEY:test}
    path-style: ${STORAGE_PATH_STYLE:true}
    quarantine-bucket: ${STORAGE_QUARANTINE_BUCKET:takura-quarantine-local}
    private-bucket: ${STORAGE_PRIVATE_BUCKET:takura-private-clean-local}
    public-bucket: ${STORAGE_PUBLIC_BUCKET:takura-public-derivatives-local}
  scanner:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:13310}
  enquiries:
    privacy-notice-version: ${PRIVACY_NOTICE_VERSION:demo-privacy-v1}
    routing-precedence: ${ENQUIRY_ROUTING_PRECEDENCE:PROPERTY,CABINETRY,BOARDS,GENERAL}
    business-clock:
      timezone: ${BUSINESS_TIMEZONE:Africa/Johannesburg}
      opens: ${BUSINESS_OPENS:08:00}
      closes: ${BUSINESS_CLOSES:17:00}
      holidays: ${BUSINESS_HOLIDAYS:}
      rule-version: ${BUSINESS_CLOCK_RULE_VERSION:demo-business-hours-v1}
  security:
    allowed-origins: ${STAFF_ALLOWED_ORIGINS:http://localhost:4201}
    oidc:
      issuer: ${STAFF_OIDC_ISSUER:http://127.0.0.1:8080/dev-oidc}
      jwk-set-uri: ${STAFF_OIDC_JWKS_URI:http://127.0.0.1:8080/dev-oidc/jwks}
      client-id: ${STAFF_OIDC_CLIENT_ID:takura-staff-local}
      audience: ${STAFF_OIDC_AUDIENCE:takura-api}
      required-scope: ${STAFF_OIDC_REQUIRED_SCOPE:takura.staff}
    session:
      idle-timeout: ${STAFF_SESSION_IDLE_TIMEOUT:PT30M}
      absolute-timeout: ${STAFF_SESSION_ABSOLUTE_TIMEOUT:PT8H}
      fresh-authentication-window: ${STAFF_SESSION_FRESH_AUTH_WINDOW:PT5M}
    bootstrap:
      enabled: false
    local-provider-enabled: false
