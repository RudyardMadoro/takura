openapi: 3.1.0
info:
  title: Takura Platform API
  version: 1.0.0
  description: Versioned contracts for the synthetic R1 preview platform.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getPublicHealth
      security: []
      responses:
        '200':
          description: Minimal public health status
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /public/config:
    get:
      operationId: getPublicConfig
      security: []
      responses:
        '200':
          description: Public-safe synthetic configuration
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
  /admin/probe:
    get:
      operationId: getPrivateProbe
      security:
        - staffBearer: []
          staffSession: []
      responses:
        '200':
          description: Authenticated private probe
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                required: [status]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/session:
    post:
      operationId: createStaffSession
      security: [{ staffBearer: [] }]
      responses:
        '201':
          {
            description: Subject-bound revocable session created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: getStaffSession
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '200':
          {
            description: Current staff authorization,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/StaffAuthorization' } } },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteStaffSession
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '204': { description: Session revoked }
  /admin/users:
    get:
      operationId: listStaffAccess
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '200':
          {
            description: Federated access grants,
            content:
              {
                application/json:
                  {
                    schema: { type: array, items: { $ref: '#/components/schemas/StaffIdentity' } },
                  },
              },
          }
    post:
      operationId: provisionStaffAccess
      security: [{ staffBearer: [], staffSession: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/StaffAccessUpdate' } } },
        }
      responses:
        '201':
          {
            description: External subject provisioned,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/StaffIdentity' } } },
          }
  /admin/users/{id}:
    put:
      operationId: updateStaffAccess
      security: [{ staffBearer: [], staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/StaffAccessUpdate' } } },
        }
      responses:
        '200': { description: Access updated }
        '412': { description: Stale revision }
        '428': { description: If-Match required }
  /admin/settings:
    get:
      operationId: listSettings
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '200':
          {
            description: Typed configuration history,
            content:
              {
                application/json:
                  { schema: { type: array, items: { $ref: '#/components/schemas/Setting' } } },
              },
          }
  /admin/settings/{id}:
    put:
      operationId: updateSetting
      security: [{ staffBearer: [], staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingUpdate' } } },
        }
      responses:
        '200': { description: Setting updated }
        '412': { description: Stale revision }
        '428': { description: If-Match required }
  /services:
    get:
      operationId: listPublishedServices
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 12, default: 12 },
          }
      responses:
        '200':
          description: Published service revisions only
          content:
            { application/json: { schema: { $ref: '#/components/schemas/PublicContentPage' } } }
  /services/{slug}:
    get:
      operationId: getPublishedService
      security: []
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string, minLength: 3, maxLength: 100 },
          }
      responses:
        '200':
          {
            description: Published service,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/PublicContent' } } },
          }
        '308':
          {
            description: Permanent published-slug redirect,
            headers: { Location: { schema: { type: string } } },
          }
        '404': { description: 'Missing, draft or archived service' }
  /projects:
    get:
      operationId: listPublishedProjects
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 60 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 12, default: 12 },
          }
      responses:
        '200':
          {
            description: Published project revisions only,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/PublicContentPage' } } },
          }
  /projects/{slug}:
    get:
      operationId: getPublishedProject
      security: []
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string, minLength: 3, maxLength: 100 },
          }
      responses:
        '200':
          {
            description: Published project,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/PublicContent' } } },
          }
        '308':
          {
            description: Permanent published-slug redirect,
            headers: { Location: { schema: { type: string } } },
          }
        '404': { description: 'Missing, draft or archived project' }
  /admin/content:
    get:
      operationId: listEditorialContent
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '200':
          {
            description: Editorial entries,
            content:
              {
                application/json:
                  { schema: { type: array, items: { $ref: '#/components/schemas/AdminContent' } } },
              },
          }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createEditorialContent
      security: [{ staffBearer: [], staffSession: [] }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/CreateContent' } } },
        }
      responses:
        '201':
          {
            description: Draft created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AdminContent' } } },
          }
        '409': { description: Slug already exists }
  /admin/content/{id}:
    get:
      operationId: getEditorialContent
      security: [{ staffBearer: [], staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: Current editable revision,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ContentEditor' } } },
          }
        '404': { description: Content was not found }
    put:
      operationId: reviseEditorialContent
      security: [{ staffBearer: [], staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: publish, in: query, schema: { type: boolean, default: false } }
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/ContentDraft' } } },
        }
      responses:
        '204': { description: Revision stored }
        '412': { description: Stale revision }
        '422': { description: Media is not cleared for publication }
        '428': { description: If-Match required }
    delete:
      operationId: archiveEditorialContent
      security: [{ staffBearer: [], staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      responses:
        '204': { description: Entry archived }
        '412': { description: Stale revision }
        '428': { description: If-Match required }
components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffSession:
      type: apiKey
      in: header
      name: X-Staff-Session
  headers:
    CorrelationId:
      description: Validated caller identifier or a server-generated UUID.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The authenticated principal is not authorised.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    PublicContent:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body_html: { type: string }
        featured: { type: boolean }
        published_at: { type: string, format: date-time }
        metadata_json: { type: string }
        revision: { type: integer, format: int64 }
      required:
        [id, slug, title, summary, body_html, featured, published_at, metadata_json, revision]
    PublicContentPage:
      type: object
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
        next_cursor: { type: [string, 'null'], format: uuid }
        page_size: { type: integer, minimum: 1, maximum: 12 }
      required: [items, next_cursor, page_size]
    AdminContent:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        content_type: { type: string, enum: [PAGE, SERVICE, PROJECT, POLICY, FAQ] }
        slug: { type: string }
        state: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        current_revision: { type: integer, format: int64 }
        published_revision: { type: [integer, 'null'], format: int64 }
        featured: { type: boolean }
        category_code: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }
      required:
        [
          id,
          content_type,
          slug,
          state,
          current_revision,
          published_revision,
          featured,
          category_code,
          published_at,
        ]
    ContentDraft:
      type: object
      additionalProperties: false
      properties:
        slug: { type: string, minLength: 3, maxLength: 100, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 160 }
        summary: { type: string, minLength: 1, maxLength: 320 }
        body_html: { type: string, minLength: 1 }
        metadata_json: { type: string }
      required: [slug, title, summary, body_html, metadata_json]
    CreateContent:
      type: object
      additionalProperties: false
      properties:
        content_type: { type: string, enum: [PAGE, SERVICE, PROJECT, POLICY, FAQ] }
        featured: { type: boolean }
        category_code: { type: [string, 'null'] }
        draft: { $ref: '#/components/schemas/ContentDraft' }
      required: [content_type, featured, category_code, draft]
    ContentEditor:
      allOf:
        - $ref: '#/components/schemas/AdminContent'
        - type: object
          properties:
            title: { type: string }
            summary: { type: string }
            body_html: { type: string }
            metadata_json: { type: string }
          required: [title, summary, body_html, metadata_json]
    StaffSession:
      type: object
      additionalProperties: false
      properties:
        session_handle: { type: string, minLength: 43, maxLength: 43 }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
      required: [session_handle, idle_expires_at, absolute_expires_at]
    StaffAuthorization:
      type: object
      properties:
        identity_id: { type: string, format: uuid }
        roles: { type: array, items: { type: string } }
        teams: { type: array, items: { type: string } }
        operations: { type: array, items: { type: string } }
      required: [identity_id, roles, teams, operations]
    StaffIdentity:
      type: object
      properties:
        id: { type: string, format: uuid }
        issuer: { type: string, format: uri }
        subject: { type: string }
        display_label: { type: string }
        active: { type: boolean }
        revision: { type: integer, format: int64 }
      required: [id, issuer, subject, display_label, active, revision]
    StaffAccessUpdate:
      type: object
      additionalProperties: false
      properties:
        issuer: { type: string, format: uri }
        subject: { type: string }
        display_label: { type: string, maxLength: 160 }
        active: { type: boolean }
        roles: { type: array, uniqueItems: true, items: { type: string } }
        teams: { type: array, uniqueItems: true, items: { type: string } }
        operations: { type: array, uniqueItems: true, items: { type: string } }
      required: [issuer, subject, display_label, active, roles, teams, operations]
    Setting:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        value: { type: string }
        value_type:
          { type: string, enum: [STRING, BOOLEAN, INTEGER, DECIMAL, URI, EMAIL, PHONE, DURATION] }
        environment: { type: string }
        status: { $ref: '#/components/schemas/ConfigurationStatus' }
        effective_at: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
        changed_at: { type: string, format: date-time }
      required:
        [id, key, value, value_type, environment, status, effective_at, revision, changed_at]
    SettingUpdate:
      type: object
      additionalProperties: false
      properties:
        value: { type: string }
        value_type: { type: string }
        status: { $ref: '#/components/schemas/ConfigurationStatus' }
        effective_at: { type: string, format: date-time }
      required: [value, value_type, status, effective_at]
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [UP] }
      required: [status]
    PublicConfig:
      type: object
      additionalProperties: false
      properties:
        environment: { $ref: '#/components/schemas/ConfigurationStatus' }
        contact: { $ref: '#/components/schemas/Contact' }
      required: [environment, contact]
    Contact:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        phone: { type: string }
      required: [email, phone]
    Location:
      type: object
      additionalProperties: false
      properties:
        locality: { type: string }
        region: { type: string }
        country_code: { type: string, minLength: 2, maxLength: 2 }
    Money:
      type: object
      additionalProperties: false
      properties:
        amount: { type: string, pattern: '^-?[0-9]+(\\.[0-9]+)?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
      required: [amount, currency]
    PageMetadata:
      type: object
      additionalProperties: false
      properties:
        next_cursor: { type: [string, 'null'] }
        page_size: { type: integer, minimum: 1, maximum: 100 }
      required: [next_cursor, page_size]
    ConfigurationStatus:
      type: string
      enum: [DEMO, PENDING, CONFIRMED, RETIRED]
    FieldError:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        code: { type: string }
        user_message: { type: string }
      required: [path, code, user_message]
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
      required: [code, message, correlation_id, field_errors]
