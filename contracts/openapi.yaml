openapi: 3.1.0
info:
  title: Takura Platform API
  version: 1.0.0
  description: Versioned contracts for the synthetic R1 preview platform.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getPublicHealth
      security: []
      responses:
        '200':
          description: Minimal public health status
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /public/config:
    get:
      operationId: getPublicConfig
      security: []
      responses:
        '200':
          description: Public-safe synthetic configuration
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
  /admin/probe:
    get:
      operationId: getPrivateProbe
      security:
        - staffBearer: []
          staffSession: []
      responses:
        '200':
          description: Authenticated private probe
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                required: [status]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/session:
    post:
      operationId: createStaffSession
      security: [{ staffBearer: [] }]
      responses:
        '201':
          {
            description: Subject-bound revocable session created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: getStaffSession
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '200':
          {
            description: Current staff authorization,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/StaffAuthorization' } } },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteStaffSession
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '204': { description: Session revoked }
  /admin/users:
    get:
      operationId: listStaffAccess
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '200':
          {
            description: Federated access grants,
            content:
              {
                application/json:
                  {
                    schema: { type: array, items: { $ref: '#/components/schemas/StaffIdentity' } },
                  },
              },
          }
    post:
      operationId: provisionStaffAccess
      security: [{ staffBearer: [], staffSession: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/StaffAccessUpdate' } } },
        }
      responses:
        '201':
          {
            description: External subject provisioned,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/StaffIdentity' } } },
          }
  /admin/users/{id}:
    put:
      operationId: updateStaffAccess
      security: [{ staffBearer: [], staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/StaffAccessUpdate' } } },
        }
      responses:
        '200': { description: Access updated }
        '412': { description: Stale revision }
        '428': { description: If-Match required }
  /admin/settings:
    get:
      operationId: listSettings
      security: [{ staffBearer: [], staffSession: [] }]
      responses:
        '200':
          {
            description: Typed configuration history,
            content:
              {
                application/json:
                  { schema: { type: array, items: { $ref: '#/components/schemas/Setting' } } },
              },
          }
  /admin/settings/{id}:
    put:
      operationId: updateSetting
      security: [{ staffBearer: [], staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/SettingUpdate' } } },
        }
      responses:
        '200': { description: Setting updated }
        '412': { description: Stale revision }
        '428': { description: If-Match required }
components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffSession:
      type: apiKey
      in: header
      name: X-Staff-Session
  headers:
    CorrelationId:
      description: Validated caller identifier or a server-generated UUID.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The authenticated principal is not authorised.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    StaffSession:
      type: object
      additionalProperties: false
      properties:
        session_handle: { type: string, minLength: 43, maxLength: 43 }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
      required: [session_handle, idle_expires_at, absolute_expires_at]
    StaffAuthorization:
      type: object
      properties:
        identity_id: { type: string, format: uuid }
        roles: { type: array, items: { type: string } }
        teams: { type: array, items: { type: string } }
        operations: { type: array, items: { type: string } }
      required: [identity_id, roles, teams, operations]
    StaffIdentity:
      type: object
      properties:
        id: { type: string, format: uuid }
        issuer: { type: string, format: uri }
        subject: { type: string }
        display_label: { type: string }
        active: { type: boolean }
        revision: { type: integer, format: int64 }
      required: [id, issuer, subject, display_label, active, revision]
    StaffAccessUpdate:
      type: object
      additionalProperties: false
      properties:
        issuer: { type: string, format: uri }
        subject: { type: string }
        display_label: { type: string, maxLength: 160 }
        active: { type: boolean }
        roles: { type: array, uniqueItems: true, items: { type: string } }
        teams: { type: array, uniqueItems: true, items: { type: string } }
        operations: { type: array, uniqueItems: true, items: { type: string } }
      required: [issuer, subject, display_label, active, roles, teams, operations]
    Setting:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        value: { type: string }
        value_type:
          { type: string, enum: [STRING, BOOLEAN, INTEGER, DECIMAL, URI, EMAIL, PHONE, DURATION] }
        environment: { type: string }
        status: { $ref: '#/components/schemas/ConfigurationStatus' }
        effective_at: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
        changed_at: { type: string, format: date-time }
      required:
        [id, key, value, value_type, environment, status, effective_at, revision, changed_at]
    SettingUpdate:
      type: object
      additionalProperties: false
      properties:
        value: { type: string }
        value_type: { type: string }
        status: { $ref: '#/components/schemas/ConfigurationStatus' }
        effective_at: { type: string, format: date-time }
      required: [value, value_type, status, effective_at]
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [UP] }
      required: [status]
    PublicConfig:
      type: object
      additionalProperties: false
      properties:
        environment: { $ref: '#/components/schemas/ConfigurationStatus' }
        contact: { $ref: '#/components/schemas/Contact' }
      required: [environment, contact]
    Contact:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        phone: { type: string }
      required: [email, phone]
    Location:
      type: object
      additionalProperties: false
      properties:
        locality: { type: string }
        region: { type: string }
        country_code: { type: string, minLength: 2, maxLength: 2 }
    Money:
      type: object
      additionalProperties: false
      properties:
        amount: { type: string, pattern: '^-?[0-9]+(\\.[0-9]+)?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
      required: [amount, currency]
    PageMetadata:
      type: object
      additionalProperties: false
      properties:
        next_cursor: { type: [string, 'null'] }
        page_size: { type: integer, minimum: 1, maximum: 100 }
      required: [next_cursor, page_size]
    ConfigurationStatus:
      type: string
      enum: [DEMO, PENDING, CONFIRMED, RETIRED]
    FieldError:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        code: { type: string }
        user_message: { type: string }
      required: [path, code, user_message]
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
      required: [code, message, correlation_id, field_errors]
