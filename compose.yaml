name: takura-local
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD}
      TAKURA_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD}
      TAKURA_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD}
    ports:
      - '127.0.0.1:${DATABASE_HOST_PORT}:5432'
    volumes:
      - takura-postgres-data:/var/lib/postgresql
      - ./infra/contabo/postgres/init-local.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_MIGRATION_USER} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
volumes:
  takura-postgres-data:
